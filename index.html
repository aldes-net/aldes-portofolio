<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Aldes</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 50px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      animation: fadeInUp 1.2s ease-out; /* animasi masuk */
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .btn {
      background: white;
      color: #764ba2;
      padding: 15px 30px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn:hover {
      transform: scale(1.1) rotate(-2deg); /* animasi pas dihover */
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    /* Keyframes animasi */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 20px #fff, 0 0 30px #764ba2; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Halo, Saya Aldes atau Ateng 👋</h1>
    <p>Web Developer | Desainer | Investor</p>
    <a href="https://github.com/aldes-net" class="btn" target="_blank">Lihat GitHub Saya</a>
  </div>
</body>
</html>
